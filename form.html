<html>
  <head>
    <title>CHAT APPILICATION</title>
    <link rel="styleSheet" href="form.css" />
  </head>
  <body>
    <div class="main">
      <form>
        <h2>Realtime Chat Appilication</h2>
        <div class="container">
          <div class="f11">
            <label>Enter first name:</label>
            <input type="text" placeholder="first name" id="f1" />
          </div>
          <div class="l11">
            <label>Enter last name:</label>
            <input type="text" placeholder="last name" id="l1" />
          </div>
        </div>
        <div class="e11">
          <label>Enter your Email:</label>
          <input type="mail" placeholder="enter email" id="e1" />
        </div>
        <div class="e11">
          <label>Enter your Password:</label>
          <input type="password" placeholder="enter Password" id="e1" />
        </div>
        <div class="f11">
          <label>Choose a file:</label>
          <input type="file" id="f1" />
        </div>
        <div class="s11">
          <input type="submit" value="Continue to Chat" id="s1" />
        </div>
        <div class="ll1">
          <p>Already signed up? <a href="login.html">Login now</a></p>
        </div>
      </form>
    </div>
  </body>
</html>
