<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="form.css" />
    <script defer src="signup.js"></script>
  </head>
  <body>
    <div class="main">
      <form>
        <h2>Real-Time Chat Application</h2>
        <div class="container">
          <div class="f11">
            <label>First Name:</label>
            <input type="text" placeholder="First Name" id="f1" required />
          </div>
          <div class="l11">
            <label>Last Name:</label>
            <input type="text" placeholder="Last Name" id="l1" required />
          </div>
        </div>
        <div class="e11">
          <label>Email:</label>
          <input type="email" placeholder="Enter Email" id="e1" required />
        </div>
        <div class="e11 password-container">
          <label>Password:</label>
          <input
            type="password"
            placeholder="Enter Password"
            id="p1"
            required
          />
          <span class="eye-icon" id="togglePassword">👁️</span>
        </div>
        <div class="s11">
          <input type="submit" value="Sign Up" />
        </div>
        <div class="ll1">
          <p>Already signed up? <a href="login.html">Login now</a></p>
        </div>
      </form>
    </div>
  </body>
</html>
