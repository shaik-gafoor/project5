<html>
  <head>
    <title>Login Page</title>
    <link href="login.css" rel="stylesheet" />
    <script defer src="login.js"></script>
  </head>
  <body>
    <form>
      <div class="container">
        <h2>Real-Time Chat Application</h2>
        <div class="e11">
          <label>Enter Username (Email):</label>
          <input type="email" placeholder="Enter Email" id="e1" required />
        </div>
        <div class="p11">
          <label>Enter Password:</label>
          <input
            type="password"
            id="p1"
            placeholder="Enter Password"
            required
          />
        </div>
        <div class="l11">
          <input type="submit" value="LOGIN" />
        </div>
        <p>Not yet Signed Up? <a href="signup.html">Sign up</a></p>
      </div>
    </form>
  </body>
</html>
