<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Chat Application</title>

    <!-- Font Awesome Icons for UI -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link href="users.css" rel="stylesheet" />
    <script defer src="users.js"></script>
    <!-- Linked JavaScript file -->
  </head>
  <body>
    <!-- Main User Sidebar -->
    <div class="d1">
      <section class="s1">
        <!-- Header Section (Admin User Info) -->
        <header>
          <div class="d2">
            <!-- Admin Profile Picture -->
            <img src="img.jpg" alt="Admin Profile" />
            <div class="d3">
              <span><b>SHAIK GAFOOR</b></span>
              <p>Active Now</p>
            </div>
          </div>
          <!-- Logout Button -->
          <a href="#" class="logout" id="logout-btn">LOGOUT</a>
        </header>

        <!-- Search Bar for Finding Users -->
        <div class="d4">
          <span class="text">Select a user to start a conversation:</span><br />
          <input type="text" class="text" placeholder="Enter name to search" />
          <button><i class="fas fa-search search-icon"></i></button>
        </div>

        <!-- User List -->
        <div class="d5">
          <!-- User 1 -->
          <a href="#">
            <div class="d6">
              <img src="img1 .jpg" alt="Sai Krishna" />
              <div class="d7">
                <span>Sai Krishna</span>
                <p>This is a text message</p>
              </div>
            </div>
          </a>

          <!-- User 2 -->
          <a href="#">
            <div class="d6">
              <img src="img2.jpg" alt="Nadella Teja" />
              <div class="d7">
                <span>Nadella Teja</span>
                <p>This is a text message</p>
              </div>
            </div>
          </a>

          <!-- User 3 -->
          <a href="#">
            <div class="d6">
              <img src="img3.jpg" alt="Shaik Nouhid" />
              <div class="d7">
                <span>Shaik Nouhid</span>
                <p>This is a text message</p>
              </div>
            </div>
          </a>

          <!-- User 4 -->
          <a href="#">
            <div class="d6">
              <img src="img4.jpg" alt="Sri Krishna Chaitanya" />
              <div class="d7">
                <span>Sri Krishna Chaitanya</span>
                <p>This is a text message</p>
              </div>
            </div>
          </a>

          <!-- User 5 -->
          <a href="#">
            <div class="d6">
              <img src="img5.jpg" alt="Vishwanth" />
              <div class="d7">
                <span>Vishwanth</span>
                <p>This is a text message</p>
              </div>
            </div>
          </a>
        </div>
      </section>
    </div>
  </body>
</html>
